<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocean Fishing — Planner</title>
<style>
:root{--bg:#06121b;--panel:#0e2531;--panel2:#0b1d27;--line:#1d4356;--ink:#dbe9f0;--dim:#86a7b6;
--gold:#e9c46a;--teal:#54d1c5;--red:#e5786f;--grn:#9ecb7a;--violet:#b48ce0}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
background:radial-gradient(1100px 520px at 15% -8%,#12384d 0%,transparent 60%),
radial-gradient(900px 500px at 100% 0%,#123a44 0%,transparent 55%),
linear-gradient(165deg,#05101a,#081c28 55%,#040d15)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:.3px}
a{color:var(--teal)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px}
header.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(9px);
background:linear-gradient(180deg,rgba(6,18,27,.96),rgba(6,18,27,.72));border-bottom:1px solid var(--line)}
header.top .bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:12px 18px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:18px;letter-spacing:.6px}
.brand span{color:var(--dim);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.grow{flex:1}
input[type=search],select,input[type=number],input[type=datetime-local]{background:#0a1e28;color:var(--ink);
border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;outline:none}
input[type=search]{min-width:230px}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(84,209,197,.14)}
button{cursor:pointer;background:#12303d;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font:inherit}
button:hover{border-color:var(--teal)}
button.on{background:#16414f;border-color:var(--teal);color:#eafffb}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--dim);background:#0a1e28}
.chip.on{color:#06121b;background:var(--gold);border-color:var(--gold);font-weight:600}
main{padding-top:20px}
section{margin:26px 0}
.sechead{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.sechead h2{font-size:20px}
.sechead .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;
padding:16px 18px;box-shadow:0 10px 26px rgba(0,0,0,.28)}
.grid{display:flex;flex-wrap:wrap;gap:16px}
.grid>.card{flex:1 1 320px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid rgba(29,67,86,.6);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.6px;position:sticky;top:0}
tbody tr:hover{background:rgba(84,209,197,.06)}
td.num,th.num{text-align:right}
.stars{color:var(--gold);letter-spacing:1px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim);margin-right:4px}
.tag.spec{color:var(--violet);border-color:#5b3f7d}
.tag.intu{color:var(--gold);border-color:#7a6432}
.tag.new{color:var(--teal);border-color:#2f6d6a}
.bites{color:var(--dim);font-size:12.5px}
.bites b{color:var(--ink);font-weight:600}
.notes{color:var(--dim);font-size:12.5px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--dim)}
details{border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,var(--panel),var(--panel2));margin:10px 0;overflow:hidden}
details>summary{cursor:pointer;padding:11px 15px;list-style:none;display:flex;gap:10px;align-items:center;font-weight:600}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"▸";color:var(--teal);transition:transform .15s}
details[open]>summary:before{transform:rotate(90deg)}
details .body{padding:2px 15px 14px}
.sub{margin:12px 0 4px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.voyage{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.voyage .when{min-width:190px}
.voyage .when .t{font-size:17px;font-weight:650}
.voyage .when .u{color:var(--dim);font-size:12.5px}
.stopcard{flex:1 1 300px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#0a1d27}
.stopcard h4{margin:0 0 2px;font-size:15px}
.tod{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
.top-fish{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed rgba(29,67,86,.55);font-size:13px}
.top-fish .p{color:var(--gold);font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--teal);font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);animation:p 1.8s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
.muted{color:var(--dim)}
.hide{display:none !important}
@media print{
 body{background:#fff;color:#111}
 header.top{position:static;background:#fff;border-color:#ccc}
 .noprint{display:none !important}
 .card,details,.stopcard{background:#fff;border-color:#ccc;box-shadow:none}
 th{color:#444} .notes,.bites{color:#444} .stars{color:#a07b12}
}
@media(max-width:760px){.wrap{padding:0 12px 40px} header.top .bar{padding:10px 12px}}

.voyagecard{margin:12px 0}
.fam{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.fam.indigo{color:#8fd0e8;border-color:#2f5d72}
.fam.ruby{color:#f0a6a0;border-color:#7a3f3a}
.next{border-color:var(--gold);box-shadow:0 0 0 1px rgba(233,196,106,.25),0 10px 26px rgba(0,0,0,.3)}
.count{color:var(--gold);font-variant-numeric:tabular-nums}
.tgt{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed rgba(29,67,86,.5);font-size:13px}
.tgt .b{color:var(--dim);font-size:12px}
</style></head><body>
<header class="top"><div class="bar">
  <div class="brand"><b>Ocean Fishing</b><span>Planner</span></div>
  <div class="grow"></div>
  <span class="live"><span class="dot"></span><span id="clock">—</span></span>
  <div class="chips" id="fam">
    <span class="chip on" data-f="both">Both</span><span class="chip" data-f="indigo">Indigo</span><span class="chip" data-f="ruby">Ruby</span>
  </div>
  <label class="muted noprint" style="display:flex;gap:6px;align-items:center">show
    <select id="n"><option>4</option><option selected>8</option><option>12</option><option>20</option></select></label>
</div></header>
<div class="wrap"><main id="app"></main></div>

   var out=[];
   if(fam==="indigo"){
     var r=DATA.indigo_routes.find(function(x){return x.code===info.code;});
     var ix=indigoIndex();
     (r?r.stops:[]).forEach(function(s){var e=ix[s.name]||{normal:[],spectral:[]};
       out.push({name:s.name,time:s.time,normal:e.normal,spectral:e.spectral});});
   } else {
     var meta=DATA.ruby_meta[info.label]||[];
     var rix=rubyIndex();
     meta.forEach(function(m){
       var key=RUBY_KEY.map(function(k){return k[0]}).find(function(w){return m[0].indexOf(w)>=0;});
       var e=(key&&rix[key])||{normal:[],spectral:[]};
       out.push({name:m[0],time:m[1],normal:e.normal,spectral:e.spectral});
     });
   }
   return out;
 }

 function fmtLocal(d){return d.toLocaleString([], {weekday:"short",hour:"2-digit",minute:"2-digit"});}
 function fmtUTC(d){return d.toISOString().slice(5,16).replace("T"," ")+" UTC";}
 function countdown(ms){var s=Math.max(0,Math.round((ms-Date.now())/1000));
   var h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
   return (h?h+"h ":"")+m+"m "+(ss<10?"0":"")+ss+"s";}

 function topTargets(stop){
   var all=(stop.normal||[]).slice();
   var intu=all.filter(function(f){return f.intuition||/Intuition/.test(f.notes||"")});
   all.sort(function(a,b){return (b.points||0)-(a.points||0)});
   var top=all.slice(0,4);
   intu.forEach(function(f){if(top.indexOf(f)<0)top.push(f);});
   return top;
 }
 function renderStop(stop){
   var c=document.createElement("div");c.className="stopcard";
   var h="<h4>"+esc(stop.name)+"</h4><div class=tod>"+esc(stop.time)+"</div>";
   var tg=topTargets(stop);
   if(tg.length){
     h+="<div style='margin-top:8px'>";
     tg.forEach(function(f){
       var tag=(f.intuition||/Intuition/.test(f.notes||""))?"<span class='tag intu'>int</span>":"";
       h+="<div class=tgt><span>"+tag+esc(f.name)+" <span class=b>"+esc(biteStr(f))+"</span></span><span class=p>"+(f.points||"")+"</span></div>";
     });
     h+="</div>";
   }
   if(stop.spectral&&stop.spectral.length){
     var sp=stop.spectral.slice().sort(function(a,b){return (b.points||0)-(a.points||0)}).slice(0,3);
     h+="<div class=sub style='margin:9px 0 2px'>If Spectral Current</div>";
     sp.forEach(function(f){h+="<div class=tgt><span>"+esc(f.name)+" <span class=b>"+esc(biteStr(f))+"</span></span><span class=p>"+(f.points||"")+"</span></div>";});
   }
   c.innerHTML=h;return c;
 }

 function renderVoyage(ms,fam,isNext){
   var info=at(ms,fam);
   var card=document.createElement("div");card.className="card voyagecard"+(isNext?" next":"");
   card.setAttribute("data-fam",fam);
   var d=new Date(ms);
   var head="<div class=voyage><div class=when><div class='fam "+fam+"'>"+fam+"</div><div class=t>"+esc(info.label)+"</div>"+
     "<div class=u>"+esc(fmtLocal(d))+" &middot; "+esc(fmtUTC(d))+"</div>"+
     (isNext?"<div class=count>sails in "+countdown(ms)+"</div>":"")+"</div>";
   card.innerHTML=head+"</div>";
   var row=document.createElement("div");row.className="grid";row.style.marginTop="10px";
   stops(fam,info).forEach(function(s){row.appendChild(renderStop(s));});
   card.appendChild(row);
   return card;
 }

 var app=document.getElementById("app"), fam="both", n=8;
 function render(){
   app.innerHTML="";
   var now=Date.now(), first=vn(now)+1;
   var made=0;
   for(var i=0; made<n && i<Math.max(n*2,12); i++){
     var ms=(first+i)*TWO, fams=(fam==="both")?["indigo","ruby"]:[fam];
     fams.forEach(function(f){ if(made<n){ app.appendChild(renderVoyage(ms,f,made===0)); made++; } });
   }
 }
 document.getElementById("fam").addEventListener("click",function(e){
   var c=e.target.closest(".chip");if(!c)return;
   [].forEach.call(this.children,function(x){x.classList.toggle("on",x===c)});
   fam=c.getAttribute("data-f");render();
 });
 document.getElementById("n").addEventListener("change",function(){n=parseInt(this.value,10)||8;render();});
 function tick(){
   var now=Date.now(), nx=(vn(now)+1)*TWO;
   document.getElementById("clock").textContent=fmtLocal(new Date(now))+" · next voyage in "+countdown(nx);
 }
 tick(); setInterval(function(){tick();
   var c=document.querySelector(".next .count"); if(c) c.textContent="sails in "+countdown((vn(Date.now())+1)*TWO);
 },1000);
 render();
 window.OF={vn:vn,indigoAt:indigoAt,rubyAt:rubyAt,stops:stops,at:at,bestOf:bestOf,topTargets:topTargets,render:render};
})();
</script></body></html>
